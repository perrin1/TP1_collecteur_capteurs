name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  qualite:
    name: Lint, typage et tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Typage (mypy --strict)
        run: python -m mypy

      - name: Tests et couverture
        run: python -m pytest --cov-report=xml --cov-report=term-missing

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  bout_en_bout:
    name: Collecte réelle et preuve d'idempotence
    runs-on: ubuntu-latest
    needs: qualite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Générer les données
        run: python generer_donnees.py

      - name: Démarrer la station C
        run: |
          nohup python faux_api.py --port 8777 > station_c.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8777/health > /dev/null; then
              echo "station C prête"; exit 0
            fi
            sleep 0.5
          done
          echo "station C injoignable"; cat station_c.log; exit 1

      - name: Première collecte
        run: collecteur collecter --verbeux --journal logs/ci.jsonl

      - name: Seconde collecte et vérification de l'idempotence
        run: |
          avant=$(python -c "import sqlite3;print(sqlite3.connect('collecte.db').execute('SELECT COUNT(*) FROM releves').fetchone()[0])")
          collecteur collecter --verbeux --journal logs/ci.jsonl
          apres=$(python -c "import sqlite3;print(sqlite3.connect('collecte.db').execute('SELECT COUNT(*) FROM releves').fetchone()[0])")
          echo "avant=$avant apres=$apres"
          if [ "$avant" != "$apres" ]; then
            echo "ÉCHEC : la seconde exécution a modifié le nombre de lignes."
            exit 1
          fi
          echo "Idempotence vérifiée : $apres lignes dans les deux cas."

      - name: Statut final
        run: collecteur statut

      - name: Conserver le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-collecte
          path: |
            logs/
            station_c.log
          if-no-files-found: ignore
