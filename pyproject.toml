[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collecteur"
version = "0.1.0"
description = "Collecteur de relevés de capteurs agricoles — TP1"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Josse Perrin FANOU" }]
dependencies = [
    "requests>=2.32",
    # Base de fuseaux horaires. Windows n'en embarque aucune que `zoneinfo`
    # sache lire : sans ce paquet, ZoneInfo("Africa/Porto-Novo") echoue et les
    # 3 800 releves de la station B sont rejetes un par un, en silence.
    # Declaree sans condition : certaines images Linux minimales n'ont pas non
    # plus /usr/share/zoneinfo.
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-requests",
]

[project.scripts]
collecteur = "collecteur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
#  Typage — partie A4 : `mypy --strict` doit passer sans erreur sur src/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
# Au-delà de --strict : interdit d'écrire `Any` explicitement dans le code.
# L'énoncé demande « aucun Any non justifié » ; on préfère que la règle soit
# vérifiée par l'outil plutôt que par la bonne volonté.
disallow_any_explicit = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Les tests peuvent appeler des fonctions sans annoter chaque fixture.
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
#  Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "N",        # conventions de nommage
    "UP",       # tournures modernes
    "B",        # bugs probables (flake8-bugbear)
    "A",        # noms masquant une primitive
    "C4",       # compréhensions
    "DTZ",      # datetime sans fuseau — crucial ici
    "RET",      # retours inutiles
    "SIM",      # simplifications
    "PTH",      # pathlib plutôt que os.path
    "RUF",
]
ignore = [
    "E501",  # longueur gérée par le formateur
    # L'énoncé (A3) impose les noms SourceIndisponible, PayloadInvalide,
    # ReleveIncoherent et ConfigurationInvalide. Le suffixe « Error »
    # exigé par N818 contredirait la consigne : règle désactivée.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------------------------------------------------------------------
#  Tests — partie D5 : couverture minimale 70 % sur src/
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=collecteur --cov-report=term-missing --cov-fail-under=70"
filterwarnings = ["error"]
